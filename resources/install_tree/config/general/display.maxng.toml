# Display and UI behavior settings
# Runtime path prefix: general.display

[general]
lightbar_prompts = true
time_format = "%H:%M:%S"
date_format = "%C-%D-%Y"
lightbar_prompts_padding = 1       # Padding spaces on EITHER side of each option (int, default 1)
lightbar_prompts_verbose = true   # When true, " or " between last two options
lightbar_prompts_brackets = ""     # "" = none, "square" = [X], "rounded" = (X)

# Login name + password entry
bounded_input_login = true
# New user registration flow
bounded_input_newuser = true
# MECCA questionnaire token fields
bounded_input_quest = true
# MEX ui_prompt_field / ui_edit_field intrinsics
bounded_input_mex = true

[file_areas]
lightbar_area = true
reduce_area = 5

# Selection highlight behavior: row, full, or name
lightbar_what = "row"

# Optional selected-row color overrides (name or 0-f nibble).
# If unset, selected foreground inherits normal text and selected
# background defaults to theme lightbar background.
lightbar_fore = ""
lightbar_back = ""

# Optional row/col boundaries as [row, col] (1-based).
# If omitted or invalid, fallback rules apply (see lightbar_areas_proposal.md).
# top_boundary = [3, 1]
# bottom_boundary = [20, 80]

# Optional fixed header/footer anchor points as [row, col].
# header_location = [1, 1]
# footer_location = [22, 1]

# Optional custom screen/display file shown additively before list.
custom_screen = ""
file_area_list = ""
file_header = "%x16%x01%x0fFile Areas %x16%x01%x0d%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%x0a%x0a"
file_format = "|tx[|hd%-4t|tx]|pr %-20a |tx... %-n%x0a"
file_format_div = "|tx |hi%-20a |tx... %-n%x0a"
file_footer = "%x0a|prLocation: |hi%b|07%x0a"

[msg_areas]
lightbar_area = true
reduce_area = 5

# Selection highlight behavior: row, full, or name
lightbar_what = "row"

# Optional selected-row color overrides (name or 0-f nibble).
lightbar_fore = ""
lightbar_back = ""

# top_boundary = [3, 1]
# bottom_boundary = [20, 80]
# header_location = [1, 1]
# footer_location = [22, 1]
custom_screen = ""
msg_area_list = ""
msg_header = "%x16%x01%x0fMessage Areas %x16%x01%x0d%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%xc4%x0a%x0a"
msg_format = "|pr%*|sy%-20a|tx ... |fi%n%x0a"
msg_format_div = "|pr |hi%-20a|tx ... |fi%n%x0a"
msg_footer = "%x0a|prLocation: |hi%b|07%x0a"

[msg_reader]
lightbar_area = true
reduce_area = 5

# Selection highlight behavior: row, full, or number
lightbar_what = "full"

# Optional selected-row color overrides.
# If lightbar_fore is unset, MCI foreground colors bleed through.
# If lightbar_back is unset, defaults to blue (|17).
lightbar_fore = ""
lightbar_back = ""
